experiment_id: FINAL_MLP_body_xyz
name: "Frozen final candidate: body-XYZ MLP contrast"
dataset:
  id: ujiindoorloc_mag
  path: data/external/ujiindoorloc_mag
target:
  column: label
window:
  length_s: 2.0
  stride_s: 1.0
sequence:
  rate_hz: 10.0
  timesteps: 20
  channels: engineered_body_xyz_features
preprocessing:
  scaler: StandardScaler_fit_per_training_fold
features:
  name: body_xyz_magnitude
  schema_version: body_xyz_magnitude@1
evaluation:
  strategy: saved_stratified_group_2fold_development_then_explicit_final_holdout
  split_manifest: data/external/ujiindoorloc_mag/manifests/development_group_folds.csv
  group_column: trajectory_id
model:
  name: mlp
  parameters:
    hidden: [64, 32]
    dropout: 0.2
    optimizer: Adam
    learning_rate: 0.001
    max_epochs: 50
    patience: 8
seed: 42
notes: Frozen as a compact neural contrast from development evidence only; public test remains locked.